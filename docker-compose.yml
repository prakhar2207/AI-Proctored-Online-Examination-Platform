version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: exam_db
    environment:
      POSTGRES_DB: exam_platform
      POSTGRES_USER: exam_user
      POSTGRES_PASSWORD: exam_secure_pass123
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: exam_redis
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    container_name: exam_backend
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-ai-proctored-exam-platform-key
      - DATABASE_URL=postgres://exam_user:exam_secure_pass123@db:5432/exam_platform
      - CELERY_BROKER_URL=redis://redis:6379/0
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - USE_LOCAL_HF_MODELS=False
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  celery_worker:
    build: ./backend
    container_name: exam_celery
    command: celery -A config worker --loglevel=info
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-ai-proctored-exam-platform-key
      - DATABASE_URL=postgres://exam_user:exam_secure_pass123@db:5432/exam_platform
      - CELERY_BROKER_URL=redis://redis:6379/0
      - HF_API_TOKEN=${HF_API_TOKEN:-}
      - USE_LOCAL_HF_MODELS=False
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis

  frontend:
    build: ./frontend
    container_name: exam_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
